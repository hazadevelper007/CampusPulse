<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusPulse</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main id="auth-screen" class="auth-screen">
    <section class="auth-brand"><span class="brand-mark">CP</span><div><p class="eyebrow">University resource system</p><h1>CampusPulse</h1></div></section>
    <section class="auth-card">
      <div class="auth-tabs"><button id="login-tab" class="active" type="button">Sign in</button><button id="register-tab" type="button">Create account</button></div>
      <form id="auth-form">
        <div id="name-field" class="auth-field hidden"><label>Full name<input id="auth-name" type="text" autocomplete="name"></label></div>
        <div class="auth-field"><label>Email<input id="auth-email" type="email" autocomplete="username" required></label></div>
        <div class="auth-field"><label>Password<input id="auth-password" type="password" autocomplete="current-password" minlength="8" required></label></div>
        <p id="auth-error" class="auth-error" role="alert"></p>
        <button id="auth-submit" class="primary wide" type="submit">Sign in</button>
      </form>
      <div class="demo-logins"><span>Demo sign-in</span><button type="button" data-email="student@campuspulse.local">Student</button><button type="button" data-email="assistant@campuspulse.local">Lab Assistant</button><button type="button" data-email="admin@campuspulse.local">Admin</button></div>
    </section>
  </main>

  <main id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <a class="brand" href="#">
        <span class="brand-mark">CP</span>
        <span>CampusPulse</span>
      </a>
      <nav>
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="resources">Lab resources</button>
        <button class="nav-item" data-view="claims">Lost & found</button>
      </nav>
      <div class="account"><strong id="account-name">Account</strong><span id="account-role">Campus access</span><button id="logout-button" class="logout-button" type="button">Sign out</button></div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Department dashboard</p>
          <h1 id="page-title">Good morning</h1>
        </div>
        <button class="primary" id="new-request">New booking</button>
      </header>

      <div id="dashboard-view" class="view active">
        <section class="stats" id="stats"></section>
        <section class="content-grid">
          <article class="panel bookings-panel">
            <div class="panel-header"><div><p class="eyebrow">Your schedule</p><h2>Upcoming bookings</h2></div></div>
            <div id="bookings" class="booking-list"></div>
          </article>
          <article class="panel pulse-panel">
            <p class="eyebrow">Lab pulse</p>
            <h2>Live availability</h2>
            <div id="resource-list" class="resource-list"></div>
          </article>
        </section>
      </div>

      <div id="resources-view" class="view">
        <section class="panel"><div class="panel-header"><div><p class="eyebrow">Campus labs</p><h2>Resources</h2></div></div><div id="resources-grid" class="resource-grid"></div></section>
      </div>

      <div id="claims-view" class="view">
        <section class="panel"><div class="panel-header"><div><p class="eyebrow">Recovery desk</p><h2>Lost & found</h2></div></div><div id="claims-list" class="claim-list"></div></section>
      </div>
    </section>
  </main>

  <dialog id="booking-dialog">
    <form id="booking-form" method="dialog">
      <div class="dialog-header"><div><p class="eyebrow">Reserve equipment</p><h2>New booking</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></div>
      <label>Resource<select id="booking-resource" required></select></label>
      <div class="field-row"><label>Start<input id="booking-start" type="datetime-local" required></label><label>End<input id="booking-end" type="datetime-local" required></label></div>
      <button class="primary wide" value="default" id="submit-booking">Confirm booking</button>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="assets/app.js"></script>
</body>
</html>
